# Build the static export and publish it to GitHub Pages.
#
# Enable it once under Settings → Pages → Source: "GitHub Actions". Pushing to
# the branch below then deploys. The build needs nothing secret: the site is a
# static export that talks to Nostr relays from the browser, and the signed
# schema it serves is a committed file — see "Before going live" in SEEDING.md.
name: Deploy to GitHub Pages

on:
  push:
    branches: [bitcoin.mov]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a queued one but never
# interrupts one that is mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The site lives at https://bitcoin.mov (Settings → Pages → Custom domain),
      # so NEXT_PUBLIC_BASE_PATH stays unset. It is only needed under a sub-path
      # such as https://user.github.io/repo.
      - run: npm run build
        env:
          NODE_ENV: production

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
